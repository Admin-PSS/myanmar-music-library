<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1740">
<title>ဖြူနီဝါပြာ Music Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f0d2e;
    --bg2:      #1a1740;
    --bg3:      #252250;
    --border:   #2e2a6a;
    --accent:   #7c3aed;
    --accent2:  #a78bfa;
    --accent3:  #ede9fe;
    --fg:       #e0e7ff;
    --fg2:      #9ca3af;
    --fg3:      #6b7280;
    --green:    #34d399;
    --yellow:   #fbbf24;
    --pink:     #f472b6;
    --blue:     #60a5fa;
    --panel-w:  240px;
    --detail-w: 340px;
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: 'Inter', 'Padauk', sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    flex-direction: column;
  }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    z-index: 10;
  }
  .logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .logo-icon {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--accent), var(--blue));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .logo-text { font-size: 15px; font-weight: 700; color: var(--fg); font-family: 'Padauk', sans-serif; }
  .logo-sub  { font-size: 11px; color: var(--accent2); }

  .search-wrap {
    flex: 1;
    max-width: 480px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--fg3); pointer-events: none;
  }
  #global-search {
    width: 100%;
    background: var(--bg3);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px 7px 34px;
    color: var(--fg);
    font-size: 13px;
    font-family: 'Padauk', 'Inter', sans-serif;
    outline: none;
    transition: border-color .15s;
  }
  #global-search:focus { border-color: var(--accent); }
  #global-search::placeholder { color: var(--fg3); }

  #result-count {
    font-size: 12px; color: var(--fg2); flex-shrink: 0;
    margin-left: auto;
  }

  /* ── Main layout ─────────────────────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: var(--panel-w) 1fr var(--detail-w);
    flex: 1;
    overflow: hidden;
  }

  /* ── Left panel (Artists) ────────────────────────────────── */
  .artist-panel {
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-label {
    padding: 10px 14px 6px;
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    color: var(--fg3); text-transform: uppercase;
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
  }

  #artist-search {
    margin: 4px 10px 6px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--fg);
    font-size: 12px;
    font-family: 'Padauk', 'Inter', sans-serif;
    outline: none;
    width: calc(100% - 20px);
    flex-shrink: 0;
    display: block;
  }
  #artist-search::placeholder { color: var(--fg3); }

  #artist-list {
    overflow-y: auto;
    flex: 1;
    padding: 4px 0;
  }
  .artist-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 14px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Padauk', sans-serif;
    color: var(--fg2);
    transition: background .12s, color .12s;
  }
  .artist-item:hover { background: var(--bg3); color: var(--fg); }
  .artist-item.active { background: var(--accent); color: #fff; }
  .artist-item .artist-count {
    font-size: 10px;
    background: rgba(255,255,255,.12);
    border-radius: 99px;
    padding: 1px 6px;
    flex-shrink: 0;
  }
  .artist-item.active .artist-count { background: rgba(255,255,255,.25); }
  .all-artists { font-weight: 600; }

  /* ── Albums panel ────────────────────────────────────────── */
  .albums-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .albums-toolbar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    flex-shrink: 0;
    background: var(--bg);
  }
  .type-btn {
    padding: 4px 12px;
    border-radius: 99px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--fg2);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Padauk', 'Inter', sans-serif;
    transition: all .12s;
  }
  .type-btn:hover { border-color: var(--accent2); color: var(--fg); }
  .type-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  #albums-grid {
    overflow-y: auto;
    flex: 1;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    grid-auto-rows: max-content;   /* rows must never shrink below card height */
    gap: 12px;
    align-content: start;
  }

  .album-card {
    background: var(--bg2);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: all .15s;
    position: relative;
    overflow: hidden;
  }
  .album-card:hover { border-color: var(--accent2); transform: translateY(-1px); }
  .album-card.active { border-color: var(--accent); background: #1e1b4b; }

  .album-cover {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 7px;
    display: block;
    background: var(--bg3);
    margin-bottom: 9px;
  }
  .album-cover-placeholder {
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 7px;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 9px;
  }
  .no-audio-badge {
    position: absolute; top: 20px; right: 20px;
    background: #374151; color: #fff;
    font-size: 9px; font-weight: 700;
    padding: 2px 5px; border-radius: 4px;
  }
  .type-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 600;
    padding: 2px 7px; border-radius: 99px;
    margin-bottom: 5px;
  }
  .type-dot { width: 5px; height: 5px; border-radius: 50%; }
  .album-title {
    font-size: 12px; font-weight: 700;
    color: var(--fg);
    line-height: 1.35;
    font-family: 'Padauk', sans-serif;
    margin-bottom: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .album-card.active .album-title { color: #e0e7ff; }
  .album-artist {
    font-size: 11px; color: var(--accent2); font-weight: 600;
    font-family: 'Padauk', sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .album-year { font-size: 10px; color: var(--fg3); margin-top: 1px; }

  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--fg3);
    font-size: 14px;
  }

  /* ── Detail panel ────────────────────────────────────────── */
  .detail-panel {
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .detail-scroll { overflow-y: auto; flex: 1; padding: 16px; }

  .detail-header { display: flex; gap: 14px; margin-bottom: 14px; }
  .detail-cover {
    width: 88px; height: 88px;
    object-fit: cover; border-radius: 10px; flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(124,58,237,.3);
    background: var(--bg3);
  }
  .detail-cover-placeholder {
    width: 88px; height: 88px;
    border-radius: 10px; flex-shrink: 0;
    background: var(--bg3);
    display: flex; align-items: center; justify-content: center; font-size: 32px;
  }
  .detail-meta { flex: 1; min-width: 0; }
  .detail-title {
    font-size: 15px; font-weight: 800; color: var(--fg);
    line-height: 1.3; font-family: 'Padauk', sans-serif;
    margin: 5px 0 3px;
  }
  .detail-artist { font-size: 13px; color: var(--accent2); font-weight: 700; font-family: 'Padauk', sans-serif; }
  .detail-year   { font-size: 11px; color: var(--fg3); margin-top: 2px; }
  .detail-label  { font-size: 11px; color: var(--fg2); margin-top: 3px; font-family: 'Padauk', sans-serif; }

  .info-chip {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 11px; color: var(--accent2); font-weight: 600;
    margin-bottom: 12px;
  }

  .section-label {
    font-size: 10px; font-weight: 700; letter-spacing: .08em;
    color: var(--fg3); text-transform: uppercase;
    margin-bottom: 8px;
  }

  .dl-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 13px; border-radius: 8px;
    text-decoration: none; font-size: 12px; font-weight: 600;
    margin-bottom: 6px; transition: opacity .12s;
  }
  .dl-btn:hover { opacity: .85; }
  .dl-pcloud   { background: var(--accent); color: #fff; }
  .dl-mf       { background: #1d4ed8; color: #fff; }
  .dl-blog     { background: var(--bg3); color: var(--fg2); border: 1px solid var(--border); }

  .tracklist { margin-top: 14px; }
  .track-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 8px; border-radius: 6px;
    font-family: 'Padauk', sans-serif; font-size: 12px;
  }
  .track-item:nth-child(odd) { background: var(--bg3); }
  .track-num {
    font-size: 10px; color: var(--accent2); font-weight: 700;
    min-width: 20px; text-align: right; margin-top: 1px;
    flex-shrink: 0;
  }
  .track-name { color: var(--fg); line-height: 1.4; }

  #track-search {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--fg);
    font-size: 12px;
    font-family: 'Padauk', 'Inter', sans-serif;
    outline: none;
    margin-bottom: 8px;
  }
  #track-search::placeholder { color: var(--fg3); }
  .track-item.highlight { background: #2d1f6e; }
  .track-item.hidden { display: none; }

  .placeholder-detail {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--fg3); font-size: 13px; gap: 8px; padding: 40px;
    text-align: center;
  }
  .placeholder-detail .big { font-size: 40px; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; z-index: 99;
    transition: opacity .3s;
  }
  #loading .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Listen (MediaFire streaming) ────────────────────────── */
  .listen { margin-top: 14px; }
  .listen-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
  .listen-head .section-label { margin: 0; }
  .play-all {
    background: var(--accent); color: #fff; border: 0; border-radius: 99px;
    padding: 4px 11px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .play-all:hover { opacity: .85; }
  .mf-status { font-size: 11px; color: var(--fg3); padding: 6px 2px; }
  .mf-status.err { color: #f87171; }
  .mf-folder { font-size: 10px; color: var(--fg3); margin: 8px 2px 4px; font-family: 'Padauk', sans-serif; }
  .mf-track {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 6px; border-radius: 6px;
    font-family: 'Padauk', sans-serif; font-size: 12px;
  }
  .mf-track:nth-child(odd) { background: var(--bg3); }
  .mf-track.playing { background: #2d1f6e; }
  .mf-track.bad .mf-name { color: #f87171; }
  .mf-play {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    border: 0; background: var(--accent); color: #fff; font-size: 10px; cursor: pointer;
  }
  .mf-play:disabled { background: var(--border); cursor: default; }
  .mf-name { flex: 1; min-width: 0; color: var(--fg); line-height: 1.4; overflow-wrap: anywhere; }
  .mf-size { font-size: 10px; color: var(--fg3); white-space: nowrap; font-family: 'Inter', sans-serif; }
  .mf-dl { color: var(--fg3); text-decoration: none; font-size: 13px; }
  .mf-dl:hover { color: var(--accent2); }

  /* ── Player bar ──────────────────────────────────────────── */
  #player {
    display: none; flex-shrink: 0;
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 8px 16px; gap: 12px; align-items: center;
  }
  #player.show { display: flex; }
  #player img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--bg3); flex-shrink: 0; }
  .pl-info { min-width: 0; width: 220px; flex-shrink: 0; }
  .pl-title { font-size: 13px; font-weight: 700; font-family: 'Padauk', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-artist { font-size: 11px; color: var(--accent2); font-family: 'Padauk', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-btn { background: transparent; border: 0; color: var(--fg); font-size: 16px; cursor: pointer; padding: 4px 6px; }
  .pl-btn:hover { color: var(--accent2); }
  #pl-toggle { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; }
  #pl-toggle:hover { color: #fff; opacity: .85; }
  .pl-seek { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pl-seek input { flex: 1; accent-color: var(--accent); min-width: 0; }
  .pl-time { font-size: 11px; color: var(--fg3); font-variant-numeric: tabular-nums; min-width: 38px; text-align: center; }
  #pl-speed { background: var(--bg3); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 3px; font-size: 11px; }
  #pl-msg { font-size: 11px; color: var(--fg3); max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pl-msg.err { color: #f87171; }
  @media (max-width: 900px) {
    .pl-info { width: 120px; }
    #pl-speed, #pl-msg { display: none; }
  }

  .grid-more { grid-column: 1/-1; height: 1px; }
  .mobile-only { display: none; }

  /* ── Mobile layout (phones / Android app) ────────────────── */
  @media (max-width: 760px) {
    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg2);
    }
    .mobile-only { display: revert; }

    header { padding: 0 12px; height: 54px; gap: 10px; }
    .logo > div:last-child { display: none; }
    .logo-icon { width: 32px; height: 32px; }
    .search-wrap { max-width: none; }
    #global-search { font-size: 16px; padding: 8px 12px 8px 34px; } /* 16px stops iOS zoom-on-focus */
    #result-count { display: none; }

    .layout { display: block; position: relative; background: var(--bg); }
    .artist-panel, .albums-panel, .detail-panel {
      position: absolute; inset: 0; border: 0; visibility: hidden; /* not display:none — keeps scroll position */
    }
    body.view-artists .artist-panel,
    body.view-albums  .albums-panel,
    body.view-detail  .detail-panel { visibility: visible; }

    #artist-search { font-size: 16px; padding: 9px 12px; }
    .artist-item { padding: 12px 16px; font-size: 15px; border-bottom: 1px solid rgba(46,42,106,.5); }
    .artist-item .artist-count { font-size: 11px; padding: 2px 8px; }

    .albums-toolbar { padding: 8px 12px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .albums-toolbar::-webkit-scrollbar { display: none; }
    .type-btn { padding: 6px 14px; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
    .albums-heading { font-size: 12px; color: var(--fg2); padding: 8px 14px 0; font-family: 'Padauk', 'Inter', sans-serif;
                      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
    #albums-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 10px 12px 16px; }
    .album-card { padding: 9px; border-width: 1.5px; }
    .album-card:hover { transform: none; }
    .album-title { font-size: 13px; }
    .album-artist { font-size: 12px; }

    .detail-scroll { padding: 12px 14px 20px; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 4px;
      background: transparent; border: 0; color: var(--accent2);
      font-size: 14px; font-weight: 600; padding: 6px 0 10px; cursor: pointer; font-family: inherit;
    }
    .detail-cover, .detail-cover-placeholder { width: 112px; height: 112px; }
    .detail-title { font-size: 17px; }
    .detail-artist { font-size: 14px; }
    .dl-btn { padding: 12px 14px; font-size: 14px; }
    .track-item { font-size: 14px; padding: 8px; }
    .mf-track { font-size: 14px; padding: 7px 6px; }
    .mf-play { width: 34px; height: 34px; font-size: 12px; }
    .mf-dl { font-size: 16px; padding: 4px; }
    .play-all { padding: 7px 14px; font-size: 12px; }
    #track-search { font-size: 16px; }

    /* compact player: [cover][title][⏮ ▶ ⏭] with a seek row underneath */
    #player { flex-wrap: wrap; padding: 8px 12px 6px; gap: 6px 10px; }
    .pl-info { flex: 1; width: auto; }
    .pl-btn { font-size: 18px; padding: 6px 8px; }
    #pl-toggle { width: 42px; height: 42px; font-size: 15px; }
    .pl-seek { order: 10; flex-basis: 100%; }
    #pl-msg { display: block; order: 11; flex-basis: 100%; max-width: none; text-align: center; }
    #pl-msg:empty { display: none; }

    /* bottom tab bar */
    #tabbar {
      display: flex; flex-shrink: 0;
      background: var(--bg2); border-top: 1px solid var(--border);
    }
    .tab {
      flex: 1; background: transparent; border: 0; color: var(--fg3);
      padding: 7px 0 8px; font-size: 11px; font-weight: 600; font-family: 'Inter', sans-serif;
      display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
    }
    .tab .ico { font-size: 19px; line-height: 1; filter: grayscale(1); opacity: .7; }
    .tab.active { color: var(--accent2); }
    .tab.active .ico { filter: none; opacity: 1; }
    .tab:disabled { opacity: .35; }
  }
</style>
</head>
<body class="view-albums">

<div id="loading">
  <div class="spinner"></div>
  <div style="color:var(--fg2);font-size:13px">Loading albums…</div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon">🎵</div>
    <div>
      <div class="logo-text">ဖြူနီဝါပြာ Music Library</div>
      <div class="logo-sub">မြန်မာ့ရှေးဟောင်း တေးသံသာများ</div>
    </div>
  </div>

  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="global-search" type="text" placeholder="Search artist, album, or any song name…" autocomplete="off">
  </div>

  <span id="result-count"></span>
</header>

<div class="layout">

  <div class="artist-panel">
    <div class="panel-label">Artists</div>
    <input id="artist-search" type="text" placeholder="Filter artists…" autocomplete="off">
    <div id="artist-list"></div>
  </div>

  <div class="albums-panel">
    <div class="albums-toolbar" id="type-filters"></div>
    <div class="albums-heading mobile-only" id="albums-heading"></div>
    <div id="albums-grid"></div>
  </div>

  <div class="detail-panel" id="detail-panel">
    <div class="placeholder-detail">
      <div class="big">🎵</div>
      <div>Select an album to see details and tracklist</div>
    </div>
  </div>

</div>

<div id="player">
  <img id="pl-cover" alt="">
  <div class="pl-info">
    <div class="pl-title" id="pl-title"></div>
    <div class="pl-artist" id="pl-artist"></div>
  </div>
  <button class="pl-btn" id="pl-prev" title="Previous">⏮</button>
  <button class="pl-btn" id="pl-toggle" title="Play / Pause">▶</button>
  <button class="pl-btn" id="pl-next" title="Next">⏭</button>
  <div class="pl-seek">
    <span class="pl-time" id="pl-cur">0:00</span>
    <input type="range" id="pl-seek" min="0" max="0" step="1" value="0">
    <span class="pl-time" id="pl-dur">--:--</span>
  </div>
  <select id="pl-speed" title="Speed">
    <option value="0.75">0.75×</option><option value="1" selected>1×</option>
    <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
  </select>
  <span id="pl-msg"></span>
</div>

<nav id="tabbar" class="mobile-only">
  <button class="tab" data-view="artists"><span class="ico">🎤</span>Artists</button>
  <button class="tab active" data-view="albums"><span class="ico">💿</span>Albums</button>
  <button class="tab" data-view="detail" id="tab-detail" disabled><span class="ico">🎧</span>Album</button>
</nav>

<script>
const TYPE_STYLES = {
  "ဓါတ်ပြားတေး":    { bg:"#fef3c7", text:"#92400e", dot:"#f59e0b" },
  "တိတ်ခွေ":         { bg:"#dbeafe", text:"#1e40af", dot:"#3b82f6" },
  "ကက်ဆက်ဇာတ်လမ်း": { bg:"#fce7f3", text:"#9d174d", dot:"#ec4899" },
};
const DEFAULT_STYLE = { bg:"#f3f4f6", text:"#374151", dot:"#6b7280" };

let allAlbums = [];
let selArtist = "All";
let selType   = "All";
let selAlbum  = null;
let globalQ   = "";

fetch("albums.json")
  .then(r => r.json())
  .then(data => {
    allAlbums = data;
    document.getElementById("loading").style.opacity = "0";
    setTimeout(() => document.getElementById("loading").style.display = "none", 300);
    buildArtistList();
    buildTypeFilters();
    renderAlbums();
  })
  .catch(() => {
    document.getElementById("loading").innerHTML =
      '<div style="color:#f87171;font-size:14px">⚠ Could not load albums.json</div>';
  });

function buildArtistList() {
  const counts = {};
  allAlbums.forEach(a => { const k = a.artist || "Unknown"; counts[k] = (counts[k] || 0) + 1; });
  renderArtistList(Object.entries(counts).sort((a,b) => a[0].localeCompare(b[0])), "");
}

function renderArtistList(entries, filter) {
  const list = document.getElementById("artist-list");
  let html = `<div class="artist-item all-artists ${selArtist==="All"?"active":""}" data-artist="All">
    All Artists <span class="artist-count">${allAlbums.length}</span></div>`;
  entries.forEach(([name, count]) => {
    if (filter && !name.toLowerCase().includes(filter) && !name.includes(filter)) return;
    html += `<div class="artist-item ${selArtist===name?"active":""}" data-artist="${escHtml(name)}">
      <span style="font-family:'Padauk',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(name)}</span>
      <span class="artist-count">${count}</span></div>`;
  });
  list.innerHTML = html;
  list.querySelectorAll(".artist-item").forEach(el => {
    el.addEventListener("click", () => {
      selArtist = el.dataset.artist; selType = "All"; globalQ = "";
      document.getElementById("global-search").value = "";
      buildArtistList();
      renderArtistList(
        Object.entries((() => { const c={}; allAlbums.forEach(a=>{const k=a.artist||"Unknown";c[k]=(c[k]||0)+1;}); return c; })()).sort((a,b)=>a[0].localeCompare(b[0])),
        document.getElementById("artist-search").value.toLowerCase()
      );
      buildTypeFilters(); renderAlbums();
      setView("albums");
    });
  });
}

document.getElementById("artist-search").addEventListener("input", function() {
  const counts = {};
  allAlbums.forEach(a=>{const k=a.artist||"Unknown";counts[k]=(counts[k]||0)+1;});
  renderArtistList(Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0])), this.value.toLowerCase());
});

function buildTypeFilters() {
  const base = selArtist === "All" ? allAlbums : allAlbums.filter(a=>(a.artist||"Unknown")===selArtist);
  const types = ["All", ...new Set(base.map(a=>a.type).filter(Boolean))];
  const bar = document.getElementById("type-filters");
  bar.innerHTML = types.map(t => `<button class="type-btn ${selType===t?"active":""}" data-type="${escHtml(t)}">${escHtml(t)}</button>`).join("");
  bar.querySelectorAll(".type-btn").forEach(btn => {
    btn.addEventListener("click", () => { selType = btn.dataset.type; buildTypeFilters(); renderAlbums(); });
  });
}

function filteredAlbums() {
  const q = globalQ.toLowerCase();
  return allAlbums.filter(a => {
    if (selArtist !== "All" && (a.artist||"Unknown") !== selArtist) return false;
    if (selType   !== "All" && a.type !== selType) return false;
    if (!q) return true;
    return (a.artist||"").includes(q) || (a.title||"").includes(q)
        || (a.tracklist||[]).some(t => t.toLowerCase().includes(q));
  });
}

/* Album grid renders in pages of PAGE cards; more are appended as the
   user scrolls near the bottom (rendering all 6,800 at once is slow on phones). */
const PAGE = 60;
let gridList = [], gridShown = 0;
const moreObserver = new IntersectionObserver(entries => {
  if (entries.some(e => e.isIntersecting)) appendAlbums();
}, { root: document.getElementById("albums-grid"), rootMargin: "600px" });

function renderAlbums() {
  gridList = filteredAlbums();
  gridShown = 0;
  const grid = document.getElementById("albums-grid");
  const countText = `${gridList.length} album${gridList.length!==1?"s":""}`;
  document.getElementById("result-count").textContent = countText;
  document.getElementById("albums-heading").textContent =
    (globalQ ? `🔍 “${globalQ}” · ` : selArtist !== "All" ? `${selArtist} · ` : "") + countText;
  grid.scrollTop = 0;
  if (!gridList.length) { grid.innerHTML = `<div class="empty-state">No albums match your search.</div>`; return; }
  grid.innerHTML = `<div class="grid-more"></div>`;
  appendAlbums();
}

function appendAlbums() {
  if (gridShown >= gridList.length) return;
  const grid = document.getElementById("albums-grid");
  const sentinel = grid.querySelector(".grid-more");
  const chunk = gridList.slice(gridShown, gridShown + PAGE);
  gridShown += chunk.length;
  sentinel.insertAdjacentHTML("beforebegin", chunk.map(albumCardHtml).join(""));
  moreObserver.disconnect();
  if (gridShown < gridList.length) moreObserver.observe(sentinel);
}

document.getElementById("albums-grid").addEventListener("click", e => {
  const card = e.target.closest(".album-card");
  if (!card) return;
  selAlbum = allAlbums.find(a => a.id === parseInt(card.dataset.id)) || null;
  document.querySelectorAll(".album-card.active").forEach(c => c.classList.remove("active"));
  card.classList.add("active");
  renderDetail();
  setView("detail");
});

function albumCardHtml(a) {
    const s = TYPE_STYLES[a.type] || DEFAULT_STYLE;
    const coverEl = a.coverUrl
      ? `<img class="album-cover" src="${escHtml(a.coverUrl)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="album-cover-placeholder" style="display:none">🎵</div>`
      : `<div class="album-cover-placeholder">🎵</div>`;
    return `<div class="album-card ${selAlbum&&selAlbum.id===a.id?"active":""}" data-id="${a.id}">
      ${coverEl}
      ${!a.pcloudUrl && !a.mediafire ? '<span class="no-audio-badge">NO AUDIO</span>' : ""}
      <span class="type-badge" style="background:${s.bg};color:${s.text}"><span class="type-dot" style="background:${s.dot}"></span>${escHtml(a.type||"")}</span>
      <div class="album-title">${escHtml(a.title||"")}</div>
      <div class="album-artist">${escHtml(a.artist||"")}</div>
      ${a.year ? `<div class="album-year">${escHtml(a.year)}</div>` : ""}
    </div>`;
}

/* ── Mobile views: one panel at a time + bottom tabs ──────────────
   Each view change pushes a history entry, so the Android back button
   (and browser back) returns to the previous panel.                 */
const isMobile = () => matchMedia("(max-width: 760px)").matches;
let curView = "albums";

function setView(v, push = true) {
  if (v === "detail" && !selAlbum) v = "albums";
  document.body.classList.remove("view-" + curView);
  document.body.classList.add("view-" + v);
  document.querySelectorAll("#tabbar .tab").forEach(t => t.classList.toggle("active", t.dataset.view === v));
  document.getElementById("tab-detail").disabled = !selAlbum;
  if (push && isMobile() && v !== curView) history.pushState({ view: v }, "");
  curView = v;
}
history.replaceState({ view: "albums" }, "");
window.addEventListener("popstate", e => setView(e.state?.view || "albums", false));

// Android app (Capacitor): hardware Back goes to the previous panel; on the
// first panel it sends the app to the background instead of closing it,
// so music keeps playing. (No-op on the website.)
const CapApp = window.Capacitor?.Plugins?.App;
if (CapApp) CapApp.addListener("backButton", () => {
  if (curView !== "albums" || history.state?.view !== "albums") history.back();
  else CapApp.minimizeApp();
});
document.querySelectorAll("#tabbar .tab").forEach(t => t.addEventListener("click", () => setView(t.dataset.view)));

function renderDetail() {
  const panel = document.getElementById("detail-panel");
  if (!selAlbum) { panel.innerHTML = `<div class="placeholder-detail"><div class="big">🎵</div><div>Select an album to see details and tracklist</div></div>`; return; }
  const a = selAlbum;
  const s = TYPE_STYLES[a.type] || DEFAULT_STYLE;
  const coverEl = a.coverUrl ? `<img class="detail-cover" src="${escHtml(a.coverUrl)}" alt="" onerror="this.style.display='none'">` : `<div class="detail-cover-placeholder">🎵</div>`;
  panel.innerHTML = `<div class="detail-scroll">
    <button class="back-btn mobile-only" onclick="history.state?.view === 'detail' ? history.back() : setView('albums')">‹ Back to albums</button>
    <div class="detail-header">
      ${coverEl}
      <div class="detail-meta">
        <span class="type-badge" style="background:${s.bg};color:${s.text}"><span class="type-dot" style="background:${s.dot}"></span>${escHtml(a.type||"")}</span>
        <div class="detail-title">${escHtml(a.title||"")}</div>
        <div class="detail-artist">${escHtml(a.artist||"")}</div>
        ${a.year        ? `<div class="detail-year">${escHtml(a.year)}</div>` : ""}
        ${a.recordLabel ? `<div class="detail-label">${escHtml(a.recordLabel)}</div>` : ""}
      </div>
    </div>
    ${a.format ? `<div class="info-chip">📁 ${escHtml(a.format)}</div>` : ""}
    <div class="section-label">Download</div>
    ${a.pcloudUrl ? `<a class="dl-btn dl-pcloud" href="${escHtml(a.pcloudUrl)}" target="_blank" rel="noopener">☁️ pCloud Download</a>` : ""}
    ${a.mediafire ? `<a class="dl-btn dl-mf"     href="${escHtml(a.mediafire)}" target="_blank" rel="noopener">🔵 MediaFire Download</a>` : ""}
    ${a.blogUrl   ? `<a class="dl-btn dl-blog"   href="${escHtml(a.blogUrl)}"   target="_blank" rel="noopener">🔗 Blog Post</a>` : ""}
    ${!a.pcloudUrl && !a.mediafire ? `<div style="font-size:12px;color:var(--fg3);margin-bottom:12px">Audio not available — cover only.</div>` : ""}
    ${a.mediafire ? `<div class="listen">
      <div class="listen-head">
        <div class="section-label">🎧 Listen</div>
        <button class="play-all" id="play-all" style="display:none">▶ Play all</button>
      </div>
      <div id="mf-tracks"><div class="mf-status">⏳ MediaFire မှ သီချင်းစာရင်း ရယူနေသည်…</div></div>
    </div>` : ""}
    <div class="tracklist">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div class="section-label" style="margin:0">Tracklist — ${(a.tracklist||[]).length} tracks</div>
      </div>
      ${(a.tracklist||[]).length > 5 ? `<input id="track-search" type="text" placeholder="Filter tracks…" autocomplete="off">` : ""}
      <div id="track-list">
        ${(a.tracklist||[]).map((t,i) => `<div class="track-item" data-track="${escHtml(t.toLowerCase())}">
          <span class="track-num">${String(i+1).padStart(2,"0")}</span>
          <span class="track-name">${escHtml(t)}</span></div>`).join("")}
      </div>
    </div>
  </div>`;
  const ts = document.getElementById("track-search");
  if (ts) ts.addEventListener("input", function() {
    const q = this.value.toLowerCase();
    document.querySelectorAll(".track-item").forEach(el => {
      const m = !q || el.dataset.track.includes(q);
      el.classList.toggle("hidden", !m);
      el.classList.toggle("highlight", !!q && m);
    });
  });
  if (a.mediafire) loadListen(a);
}

/* ═══ MediaFire streaming ═══════════════════════════════════════════
   Folder/file keys → MediaFire public API (CORS: *) → each file's
   links.normal_download (/file_premium/…) → <audio> follows the redirect
   to downloadNNNN.mediafire.com and streams it.                        */
const MF_API = "https://www.mediafire.com/api/1.5";
const AUDIO_EXT = /\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|wma)$/i;
const mfCache = new Map();          // album id → Promise<groups>

function mfParse(url) {
  let m = url.match(/mediafire\.com\/folder\/([a-z0-9]+)/i);                          if (m) return {type:"folder", key:m[1]};
  m = url.match(/mediafire\.com\/(?:file|file_premium|download|view)\/([a-z0-9]+)/i);  if (m) return {type:"file",   key:m[1]};
  m = url.match(/mediafire\.com\/\?([a-z0-9]+)/i);                                    if (m) return {type:"file",   key:m[1]};
  m = url.match(/mediafire\.com\/#([a-z0-9]+)/i);                                     if (m) return {type:"folder", key:m[1]};
  return null;
}

async function mfApi(path, params) {
  const qs = new URLSearchParams({...params, response_format:"json"});
  const r = await fetch(`${MF_API}/${path}?${qs}`);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (j.response?.result !== "Success") throw new Error(j.response?.message || "MediaFire API error");
  return j.response;
}

async function mfListAll(key, type) {
  const out = [];
  for (let chunk = 1; chunk <= 20; chunk++) {
    const r = await mfApi("folder/get_content.php", {folder_key:key, content_type:type, chunk, chunk_size:100});
    out.push(...(r.folder_content?.[type] || []));
    if (r.folder_content?.more_chunks !== "yes") break;
  }
  return out;
}

async function mfFolder(key, name = "", depth = 0) {
  const files = await mfListAll(key, "files");
  const groups = [{name, files}];
  if (depth < 2) {
    for (const sub of await mfListAll(key, "folders"))
      groups.push(...await mfFolder(sub.folderkey, sub.name, depth + 1));
  }
  return groups;
}

function mfLoad(album) {
  if (!mfCache.has(album.id)) {
    const p = (async () => {
      const ref = mfParse(album.mediafire);
      if (!ref) throw new Error("Unsupported MediaFire link");
      let groups;
      if (ref.type === "folder") groups = await mfFolder(ref.key);
      else groups = [{name:"", files:[(await mfApi("file/get_info.php", {quick_key:ref.key})).file_info]}];
      const archives = groups.flatMap(g => g.files).filter(f => f && /\.(rar|zip|7z)$/i.test(f.filename)).length;
      const result = groups.map(g => ({
        name: g.name,
        tracks: g.files
          .filter(f => f && (AUDIO_EXT.test(f.filename) || (f.mimetype || "").startsWith("audio/")))
          .sort((x, y) => x.filename.localeCompare(y.filename, undefined, {numeric:true}))
          .map(f => ({name: f.filename.replace(AUDIO_EXT, ""), size: +f.size || 0, url: f.links?.normal_download || null}))
      })).filter(g => g.tracks.length);
      result.archives = archives;
      return result;
    })();
    p.catch(() => mfCache.delete(album.id));   // allow retry after an error
    mfCache.set(album.id, p);
  }
  return mfCache.get(album.id);
}

async function loadListen(album) {
  const box = document.getElementById("mf-tracks");
  let groups;
  try { groups = await mfLoad(album); }
  catch (e) {
    if (selAlbum !== album) return;
    box.innerHTML = `<div class="mf-status err">⚠ MediaFire မှ ရယူ၍မရပါ (${escHtml(e.message)}) — အပေါ်က Download ခလုတ်ကို သုံးပါ။</div>`;
    return;
  }
  if (selAlbum !== album) return;     // user moved to another album meanwhile
  const flat = groups.flatMap(g => g.tracks);
  if (!flat.length) {
    box.innerHTML = groups.archives
      ? `<div class="mf-status">📦 ဤ album ကို RAR/ZIP ဖိုင်အဖြစ်သာ တင်ထားသဖြင့် တိုက်ရိုက်နားဆင်၍မရပါ — Download ခလုတ်ကို သုံးပါ။</div>`
      : `<div class="mf-status">နားဆင်နိုင်သော audio file မတွေ့ပါ — Download ခလုတ်ကို သုံးပါ။</div>`;
    return;
  }
  let i = 0;
  box.innerHTML = groups.map(g => `
    ${groups.length > 1 && g.name ? `<div class="mf-folder">📁 ${escHtml(g.name)}</div>` : ""}
    ${g.tracks.map(t => { const idx = i++; return `
      <div class="mf-track" data-idx="${idx}">
        <button class="mf-play" ${t.url ? "" : "disabled"} title="Play">▶</button>
        <span class="mf-name">${escHtml(t.name)}</span>
        <span class="mf-size">${(t.size / 1048576).toFixed(1)} MB</span>
        ${t.url ? `<a class="mf-dl" href="${escHtml(t.url)}" target="_blank" rel="noopener" title="Download">⬇</a>` : ""}
      </div>`; }).join("")}`).join("");
  box.querySelectorAll(".mf-track").forEach(row => {
    row.querySelector(".mf-play").onclick = () => {
      const idx = +row.dataset.idx;
      if (player.album === album && player.idx === idx) togglePlay();
      else playQueue(album, flat, idx);
    };
  });
  const pa = document.getElementById("play-all");
  pa.style.display = "";
  pa.onclick = () => playQueue(album, flat, 0);
  markPlaying();
}

/* ── Player ─────────────────────────────────────────────────────── */
const audio  = new Audio();
audio.preload = "none";
const player = { album: null, queue: [], idx: -1 };
const $p = id => document.getElementById(id);
const fmtTime = s => {
  if (!isFinite(s)) return "--:--";
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(sec).padStart(2, "0");
};
const plMsg = (t, err = false) => { const el = $p("pl-msg"); el.textContent = t; el.className = err ? "err" : ""; };

function playQueue(album, queue, idx) {
  player.album = album; player.queue = queue;
  playIdx(idx);
}

function playIdx(idx) {
  const q = player.queue;
  // skip tracks without a link
  while (idx < q.length && !q[idx].url) idx++;
  if (idx < 0 || idx >= q.length) return;
  player.idx = idx;
  const t = q[idx], a = player.album;
  $p("player").classList.add("show");
  $p("pl-title").textContent  = t.name;
  $p("pl-artist").textContent = `${a.artist || ""} — ${a.title || ""}`;
  const cov = $p("pl-cover");
  if (a.coverUrl) { cov.src = a.coverUrl; cov.style.visibility = ""; } else cov.style.visibility = "hidden";
  $p("pl-seek").max = 0; $p("pl-seek").value = 0;
  $p("pl-cur").textContent = "0:00"; $p("pl-dur").textContent = "--:--";
  plMsg("⏳ Loading…");
  audio.src = t.url;
  audio.playbackRate = parseFloat($p("pl-speed").value);
  audio.play().catch(e => { if (e.name !== "AbortError") plMsg("Play failed: " + e.message, true); });
  markPlaying();
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.name, artist: a.artist || "", album: a.title || "",
      artwork: a.coverUrl ? [{src: a.coverUrl}] : []
    });
  }
}

function togglePlay() {
  if (player.idx < 0) return;
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
}

function markPlaying() {
  document.querySelectorAll(".mf-track").forEach(row => {
    const on = player.album === selAlbum && +row.dataset.idx === player.idx;
    row.classList.toggle("playing", on);
    row.querySelector(".mf-play").textContent = on && !audio.paused ? "⏸" : "▶";
  });
  $p("pl-toggle").textContent = audio.paused ? "▶" : "⏸";
}

audio.addEventListener("playing", () => { plMsg(""); markPlaying(); });
audio.addEventListener("pause",   markPlaying);
audio.addEventListener("waiting", () => plMsg("Buffering…"));
audio.addEventListener("loadedmetadata", () => {
  $p("pl-seek").max = Math.floor(audio.duration) || 0;
  $p("pl-dur").textContent = fmtTime(audio.duration);
});
let seeking = false;
audio.addEventListener("timeupdate", () => {
  if (!seeking) $p("pl-seek").value = Math.floor(audio.currentTime);
  $p("pl-cur").textContent = fmtTime(audio.currentTime);
});
audio.addEventListener("ended", () => playIdx(player.idx + 1));
audio.addEventListener("error", () => {
  if (!audio.src || player.idx < 0) return;
  const codes = {1:"Aborted", 2:"Network error", 3:"Decode error", 4:"File blocked or unavailable"};
  plMsg("⚠ " + (codes[audio.error?.code] || "Playback error"), true);
  document.querySelector(`.mf-track[data-idx="${player.idx}"]`)?.classList.add("bad");
});
$p("pl-seek").addEventListener("input",  e => { seeking = true; $p("pl-cur").textContent = fmtTime(e.target.value); });
$p("pl-seek").addEventListener("change", e => { audio.currentTime = +e.target.value; seeking = false; });
$p("pl-toggle").onclick = togglePlay;
$p("pl-prev").onclick = () => audio.currentTime > 5 ? (audio.currentTime = 0) : playIdx(Math.max(0, player.idx - 1));
$p("pl-next").onclick = () => playIdx(player.idx + 1);
$p("pl-speed").onchange = e => audio.playbackRate = parseFloat(e.target.value);

if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play",  () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack", () => playIdx(Math.max(0, player.idx - 1)));
  navigator.mediaSession.setActionHandler("nexttrack",     () => playIdx(player.idx + 1));
}

/* ── Android app: background playback service + media notification ──
   window.Capacitor.Plugins.BackgroundAudio exists only inside the app
   (mobile/android/.../BackgroundAudioPlugin.java); on the website it's undefined. */
const BgAudio = window.Capacitor?.Plugins?.BackgroundAudio;
let bgStopped = false;
function bgUpdate(playing) {
  if (!BgAudio || player.idx < 0) return;
  if (playing) bgStopped = false;
  else if (bgStopped) return;          // closed with ✕ — don't bring the notification back on "pause"
  const t = player.queue[player.idx], a = player.album;
  BgAudio.update({ title: t.name, artist: `${a.artist || ""} — ${a.title || ""}`, playing }).catch(() => {});
}
if (BgAudio) {
  audio.addEventListener("playing", () => bgUpdate(true));
  audio.addEventListener("pause",   () => bgUpdate(false));
  BgAudio.addListener("control", ({ action }) => {
    if (action === "play")  audio.play().catch(() => {});
    if (action === "pause") audio.pause();
    if (action === "next")  $p("pl-next").click();
    if (action === "prev")  $p("pl-prev").click();
    if (action === "stop")  { bgStopped = true; audio.pause(); BgAudio.stop(); }
  });
}

document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.code === "Space" && player.idx >= 0) { e.preventDefault(); togglePlay(); }
});

document.getElementById("global-search").addEventListener("input", function() {
  globalQ = this.value; selArtist = "All"; selType = "All";
  buildArtistList(); buildTypeFilters(); renderAlbums();
  if (curView !== "albums") setView("albums");
});

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
</script>
